
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #f0f0f0; min-height: 100vh; }

  .app { min-height: 100vh; background: #0d0d0d; }

  .topbar {
    background: #1a1a1a;
    border-bottom: 2px solid #ff6a00;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
  }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: #ff6a00;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .topbar-brand .dot {
    width: 10px; height: 10px;
    background: #ff6a00;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff6a00;
  }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .btn-add {
    background: #ff6a00;
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.5px;
  }
  .btn-add:hover { background: #e05e00; }

  .board-container {
    padding: 16px;
    overflow-x: auto;
    display: flex;
    gap: 12px;
    min-height: calc(100vh - 52px);
    align-items: flex-start;
  }

  .column {
    min-width: 240px;
    width: 240px;
    background: #161616;
    border-radius: 6px;
    border: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .col-header {
    padding: 10px 12px;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .col-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #ff6a00;
  }
  .col-count {
    background: #ff6a0022;
    color: #ff6a00;
    border: 1px solid #ff6a0044;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 8px;
    min-width: 22px;
    text-align: center;
  }
  .col-body {
    padding: 8px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .col-body.drag-over {
    background: #ff6a0010;
    border-radius: 4px;
  }

  .card {
    background: #1e1e1e;
    border: 1px solid #2e2e2e;
    border-radius: 5px;
    padding: 10px;
    cursor: grab;
    position: relative;
    transition: border-color 0.15s, transform 0.1s;
    user-select: none;
  }
  .card:hover { border-color: #ff6a0055; }
  .card.dragging { opacity: 0.4; transform: scale(0.97); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    color: #ff9140;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .card-name:hover { color: #ffb070; }
  .card-id {
    font-size: 11px;
    color: #888;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .card-id:hover { color: #aaa; }
  .card-actions { display: flex; gap: 4px; }
  .card-btn {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 14px;
    padding: 1px 4px;
    border-radius: 3px;
    line-height: 1;
  }
  .card-btn:hover { color: #ff6a00; background: #ff6a0015; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .tag-crawler { background: #1a3a5c; color: #5aadff; border: 1px solid #2a5a8c; }
  .tag-manual { background: #3a2a00; color: #ffb840; border: 1px solid #6a4a00; }
  .tag-fazer { background: #2e1a1a; color: #ff7070; border: 1px solid #5a2a2a; }
  .tag-feito { background: #1a3a1a; color: #70e070; border: 1px solid #2a6a2a; }
  .card-links { margin-top: 5px; display: flex; gap: 6px; }
  .link-pill {
    font-size: 10px;
    color: #888;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 6px;
    border: 1px solid #333;
    border-radius: 3px;
    cursor: pointer;
    background: #111;
  }
  .link-pill:hover { color: #ff9140; border-color: #ff6a0055; }

  /* MODAL */
  .overlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.82);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #1a1a1a;
    border: 1px solid #333;
    border-top: 3px solid #ff6a00;
    border-radius: 8px;
    width: 520px;
    max-width: 98vw;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
  }
  .modal h2 {
    font-size: 16px;
    font-weight: 700;
    color: #ff6a00;
    margin-bottom: 18px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .form-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select, .form-group textarea {
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    color: #f0f0f0;
    font-size: 13px;
    padding: 7px 10px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: #ff6a00;
  }
  .form-group select option { background: #1a1a1a; }

  .products-section { margin-top: 14px; }
  .products-section-title {
    font-size: 11px;
    color: #888;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .product-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  .product-row input { flex: 1; }
  .btn-remove-product {
    background: none;
    border: 1px solid #3a1a1a;
    color: #ff4444;
    border-radius: 3px;
    font-size: 16px;
    cursor: pointer;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-remove-product:hover { background: #2a0a0a; }
  .btn-add-product {
    background: #111;
    border: 1px dashed #444;
    color: #888;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    padding: 5px 10px;
    width: 100%;
    margin-top: 4px;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-add-product:hover { color: #ff9140; border-color: #ff6a0055; }

  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .btn-cancel {
    background: none;
    border: 1px solid #444;
    color: #888;
    padding: 8px 18px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-cancel:hover { border-color: #666; color: #ccc; }
  .btn-save {
    background: #ff6a00;
    border: none;
    color: #fff;
    padding: 8px 22px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 700;
  }
  .btn-save:hover { background: #e05e00; }

  /* DETAIL MODAL */
  .detail-section { margin-bottom: 16px; }
  .detail-section-title {
    font-size: 10px;
    color: #666;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    border-bottom: 1px solid #222;
    padding-bottom: 4px;
  }
  .product-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: #111;
    border-radius: 4px;
    margin-bottom: 4px;
    font-size: 12px;
  }
  .product-item-name { flex: 1; color: #ddd; }
  .product-item-id { color: #888; font-size: 11px; font-family: monospace; }
  .product-status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-crawler { background: #5aadff; }
  .dot-manual { background: #ffb840; }
  .dot-fazer { background: #ff7070; }
  .dot-feito { background: #70e070; }

  /* COPY MSG MODAL */
  .copy-box {
    background: #111;
    border: 1px solid #ff6a0044;
    border-radius: 5px;
    padding: 14px;
    font-size: 13px;
    color: #f0f0f0;
    line-height: 1.7;
    white-space: pre-wrap;
    font-family: monospace;
    margin-bottom: 14px;
  }
  .btn-copy {
    background: #ff6a00;
    border: none;
    color: #fff;
    padding: 9px 22px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 700;
    width: 100%;
  }
  .btn-copy:hover { background: #e05e00; }
  .copy-success {
    color: #70e070;
    font-size: 12px;
    text-align: center;
    margin-top: 8px;
    display: none;
  }
</style>

<div class="app">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="dot"></div>
      Migration Control
    </div>
    <div class="topbar-right">
      <button class="btn-add" onclick="openAddModal()">+ Novo Cliente</button>
    </div>
  </div>

  <div class="board-container" id="board"></div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Novo Cliente</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Nome do Cliente</label>
        <input type="text" id="fName" placeholder="Ex: Empresa XYZ">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Link da Tarefa</label>
        <input type="text" id="fTaskLink" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Link do Crawler</label>
        <input type="text" id="fCrawlerLink" placeholder="https://...">
      </div>
    </div>

    <div class="products-section">
      <div class="products-section-title">
        Produtos e IDs
      </div>
      <div id="productsList"></div>
      <button class="btn-add-product" onclick="addProductRow()">+ Adicionar Produto</button>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveClient()">Salvar</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <h2 id="detailTitle">Detalhes do Cliente</h2>
    <div id="detailContent"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDetail()">Fechar</button>
      <button class="btn-save" onclick="editFromDetail()">Editar</button>
    </div>
  </div>
</div>

<!-- COPY MESSAGE MODAL -->
<div class="overlay" id="copyOverlay">
  <div class="modal">
    <h2>Mensagem de Finalização</h2>
    <div class="copy-box" id="copyText"></div>
    <button class="btn-copy" onclick="copyMessage()">Copiar Mensagem</button>
    <div class="copy-success" id="copySuccess">✓ Copiado para a área de transferência!</div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeCopyModal()">Fechar</button>
    </div>
  </div>
</div>

<script>
const COLS = [
  { id: 'iniciar', label: 'Iniciar' },
  { id: 'criando', label: 'Criando Produtos' },
  { id: 'crawler', label: 'Crawler' },
  { id: 'finalizado', label: 'Finalizado' }
];

let clients = JSON.parse(localStorage.getItem('migClients') || '[]');
let editingId = null;
let detailClientId = null;
let dragId = null;

function save() {
  localStorage.setItem('migClients', JSON.stringify(clients));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLS.forEach(col => {
    const colClients = clients.filter(c => c.status === col.id);
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.innerHTML = `
      <div class="col-header">
        <span class="col-title">${col.label}</span>
        <span class="col-count" id="cnt-${col.id}">${colClients.length}</span>
      </div>
      <div class="col-body" id="col-${col.id}" data-col="${col.id}"></div>
    `;
    board.appendChild(colEl);

    const body = colEl.querySelector('.col-body');
    body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-over'); });
    body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
    body.addEventListener('drop', e => {
      e.preventDefault();
      body.classList.remove('drag-over');
      if (dragId) {
        const client = clients.find(c => c.id === dragId);
        if (client && client.status !== col.id) {
          const prevStatus = client.status;
          client.status = col.id;
          save();
          renderBoard();
          if (col.id === 'finalizado') showCopyModal(client);
        }
      }
      dragId = null;
    });

    colClients.forEach(client => {
      const card = createCard(client);
      body.appendChild(card);
    });
  });
}

function createCard(client) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.id = client.id;

  card.addEventListener('dragstart', e => {
    dragId = client.id;
    setTimeout(() => card.classList.add('dragging'), 10);
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    dragId = null;
  });

  const productCount = (client.products || []).length;
  const ids = (client.products || []).map(p => p.id).filter(Boolean).join(', ');

  const crawlerTag = client.hasCrawler ? `<span class="tag tag-crawler">Crawler</span>` : '';
  const manualTags = client.manuals ? client.manuals.filter(m => m.name).map(m =>
    `<span class="tag ${m.done ? 'tag-feito' : 'tag-fazer'}">${m.name} ${m.done ? '✓' : '—'}</span>`
  ).join('') : '';

  const taskLink = client.taskLink ? `<a class="link-pill" href="${client.taskLink}" target="_blank"><i class="ti ti-external-link" style="font-size:11px"></i>Tarefa</a>` : '';
  const crawlerLink = client.crawlerLink ? `<a class="link-pill" href="${client.crawlerLink}" target="_blank"><i class="ti ti-external-link" style="font-size:11px"></i>Crawler</a>` : '';

  card.innerHTML = `
    <div class="card-top">
      <div>
        <div class="card-name" onclick="openDetail('${client.id}')">${client.name || 'Sem nome'}</div>
        <div class="card-id" onclick="openDetail('${client.id}')">${ids ? '#' + ids.split(',')[0].trim() : 'sem ID'} ${productCount > 1 ? `<span style="color:#666">+${productCount-1}</span>` : ''}</div>
      </div>
      <div class="card-actions">
        <button class="card-btn" onclick="openEdit('${client.id}')" title="Editar"><i class="ti ti-edit" aria-hidden="true"></i></button>
        <button class="card-btn" onclick="deleteClient('${client.id}')" title="Excluir"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="card-tags">${crawlerTag}${manualTags}</div>
    ${taskLink || crawlerLink ? `<div class="card-links">${taskLink}${crawlerLink}</div>` : ''}
  `;
  return card;
}

// ADD MODAL
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Novo Cliente';
  document.getElementById('fName').value = '';
  document.getElementById('fTaskLink').value = '';
  document.getElementById('fCrawlerLink').value = '';
  document.getElementById('productsList').innerHTML = '';
  addProductRow();
  document.getElementById('modalOverlay').classList.add('open');
}

function openEdit(id) {
  const c = clients.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Editar Cliente';
  document.getElementById('fName').value = c.name || '';
  document.getElementById('fTaskLink').value = c.taskLink || '';
  document.getElementById('fCrawlerLink').value = c.crawlerLink || '';
  document.getElementById('productsList').innerHTML = '';
  (c.products || [{ name:'', id:'', type:'crawler', manualDone: false }]).forEach(p => addProductRow(p));
  if (!(c.products || []).length) addProductRow();
  document.getElementById('modalOverlay').classList.add('open');
}

function addProductRow(p) {
  const div = document.createElement('div');
  div.className = 'product-row';
  div.innerHTML = `
    <input type="text" placeholder="Nome do produto" value="${p && p.name ? p.name : ''}" class="prod-name" style="flex:2">
    <input type="text" placeholder="ID" value="${p && p.id ? p.id : ''}" class="prod-id" style="flex:1">
    <select class="prod-type" style="flex:1.2">
      <option value="crawler" ${p && p.type==='crawler' ? 'selected' : ''}>Crawler</option>
      <option value="manual_pendente" ${p && p.type==='manual_pendente' ? 'selected' : ''}>Manual — Pendente</option>
      <option value="manual_feito" ${p && p.type==='manual_feito' ? 'selected' : ''}>Manual — Feito</option>
      <option value="fazer" ${p && p.type==='fazer' ? 'selected' : ''}>A Fazer</option>
    </select>
    <button class="btn-remove-product" onclick="this.parentNode.remove()">×</button>
  `;
  document.getElementById('productsList').appendChild(div);
}

function saveClient() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('Informe o nome do cliente.'); return; }
  const rows = document.querySelectorAll('#productsList .product-row');
  const products = [];
  rows.forEach(row => {
    const n = row.querySelector('.prod-name').value.trim();
    const i = row.querySelector('.prod-id').value.trim();
    const t = row.querySelector('.prod-type').value;
    if (n || i) products.push({ name: n, id: i, type: t });
  });

  if (editingId) {
    const c = clients.find(x => x.id === editingId);
    c.name = name;
    c.taskLink = document.getElementById('fTaskLink').value.trim();
    c.crawlerLink = document.getElementById('fCrawlerLink').value.trim();
    c.products = products;
    c.hasCrawler = products.some(p => p.type === 'crawler');
  } else {
    clients.push({
      id: genId(),
      name,
      status: 'iniciar',
      taskLink: document.getElementById('fTaskLink').value.trim(),
      crawlerLink: document.getElementById('fCrawlerLink').value.trim(),
      products,
      hasCrawler: products.some(p => p.type === 'crawler')
    });
  }
  save();
  renderBoard();
  closeModal();
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function deleteClient(id) {
  if (!confirm('Excluir este cliente?')) return;
  clients = clients.filter(c => c.id !== id);
  save(); renderBoard();
}

// DETAIL MODAL
function openDetail(id) {
  const c = clients.find(x => x.id === id);
  if (!c) return;
  detailClientId = id;
  document.getElementById('detailTitle').textContent = c.name || 'Sem nome';
  const prods = (c.products || []);

  let html = `<div class="detail-section">
    <div class="detail-section-title">Informações Gerais</div>`;
  if (c.taskLink) html += `<p style="font-size:12px;margin-bottom:6px"><span style="color:#666">Tarefa:</span> <a href="${c.taskLink}" target="_blank" style="color:#ff9140">${c.taskLink}</a></p>`;
  if (c.crawlerLink) html += `<p style="font-size:12px"><span style="color:#666">Crawler:</span> <a href="${c.crawlerLink}" target="_blank" style="color:#ff9140">${c.crawlerLink}</a></p>`;
  html += `</div>`;

  if (prods.length) {
    html += `<div class="detail-section"><div class="detail-section-title">Produtos & IDs (${prods.length})</div>`;
    prods.forEach(p => {
      let dotClass = 'dot-crawler';
      let typeLabel = 'Crawler';
      if (p.type === 'manual_pendente') { dotClass = 'dot-fazer'; typeLabel = 'Manual — Pendente'; }
      if (p.type === 'manual_feito') { dotClass = 'dot-feito'; typeLabel = 'Manual — Feito'; }
      if (p.type === 'fazer') { dotClass = 'dot-fazer'; typeLabel = 'A Fazer'; }
      html += `<div class="product-item">
        <div class="product-status-dot ${dotClass}"></div>
        <div class="product-item-name">${p.name || '—'}</div>
        <div class="product-item-id">${p.id ? '#'+p.id : ''}</div>
        <span class="tag ${dotClass === 'dot-crawler' ? 'tag-crawler' : dotClass === 'dot-feito' ? 'tag-feito' : 'tag-fazer'}" style="font-size:9px">${typeLabel}</span>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
function editFromDetail() { closeDetail(); openEdit(detailClientId); }

// COPY MODAL
function showCopyModal(client) {
  const ids = (client.products || []).map(p => p.id).filter(Boolean).join(', ');
  const label = `${client.name}${ids ? ' (' + ids + ')' : ''}`;
  const msg = `waiting for conference: ${label}\nOnboarder\nDescrição da migração: Migração finalizada aguardando conferência\nLink da tarefa: ${client.taskLink || '(sem link)'}`;
  document.getElementById('copyText').textContent = msg;
  document.getElementById('copySuccess').style.display = 'none';
  document.getElementById('copyOverlay').classList.add('open');
}
function closeCopyModal() { document.getElementById('copyOverlay').classList.remove('open'); }
function copyMessage() {
  const text = document.getElementById('copyText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copySuccess').style.display = 'block';
  });
}

renderBoard();
</script>
